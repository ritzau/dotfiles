# Mouse: click to focus panes, drag to resize, wheel to scroll history.
set -g mouse on

# Truecolor and proper terminfo so nvim (termguicolors) renders correctly.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Snappier Esc in vim/nvim; bigger scrollback; renumber windows on close.
set -sg escape-time 10
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

# Resizing panes without tapping the arrow over and over.
# The repeat window has to outlast the terminal's key-repeat delay (~500ms),
# or auto-repeat starts after tmux has already left the repeat state.
set -g repeat-time 1000

# Prefix + Ctrl-arrow starts resizing and stays in a "resize" key table, so
# plain arrows keep resizing (hold one down) until Escape or any other key.
bind -T prefix C-Left  resize-pane -L \; switch-client -T resize
bind -T prefix C-Right resize-pane -R \; switch-client -T resize
bind -T prefix C-Up    resize-pane -U \; switch-client -T resize
bind -T prefix C-Down  resize-pane -D \; switch-client -T resize

bind -T resize Left    resize-pane -L \; switch-client -T resize
bind -T resize Right   resize-pane -R \; switch-client -T resize
bind -T resize Up      resize-pane -U \; switch-client -T resize
bind -T resize Down    resize-pane -D \; switch-client -T resize
bind -T resize C-Left  resize-pane -L \; switch-client -T resize
bind -T resize C-Right resize-pane -R \; switch-client -T resize
bind -T resize C-Up    resize-pane -U \; switch-client -T resize
bind -T resize C-Down  resize-pane -D \; switch-client -T resize
bind -T resize M-Left  resize-pane -L 5 \; switch-client -T resize
bind -T resize M-Right resize-pane -R 5 \; switch-client -T resize
bind -T resize M-Up    resize-pane -U 5 \; switch-client -T resize
bind -T resize M-Down  resize-pane -D 5 \; switch-client -T resize
bind -T resize Escape  switch-client -T root
bind -T resize q       switch-client -T root
